inst_back=뒤로
inst_body=이 설치 관리자는 <b>디스크 하나를 지우고</b> 다음을 포함한 BraveOS를 설치합니다:\n  • Brave 브라우저, 파일, BraveOS 설정\n  • 2008–2022년 하드웨어용 드라이버가 포함된 Linux 커널\n  • GRUB 부트로더(BIOS 및 UEFI)\n\n모두 이 USB에서 오프라인으로 실행됩니다. 네트워크가 필요 없습니다.
