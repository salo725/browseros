# BraveWM configuration (the BraveOS window manager, v1.0.2)
# System defaults; user overrides live at ~/.config/bravos/bravos-wm.conf

# window decorations
titlebar_height = 28
corner_radius = 10

# workspaces
workspaces = 2

# look
font = Inter
color_bg_focused = #1b1433
color_bg_unfocused = #120e20
color_border_focused = #6c3ce9
color_border_unfocused = #2a2450
color_accent = #f04e23
color_accent2 = #6c3ce9

# behavior
focus_follows_mouse = false
animations = true

# launchers (apps shipped in the image)
terminal = lxterminal
file_manager = pcmanfm
browser = brave
settings = bravos-settings
launcher = bravos-dock --launcher
lock = bravos-lock

# keyboard layouts (Ctrl+Shift cycles; code shown in the top bar)
kb_layouts = us,ar
