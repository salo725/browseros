# BraveOS compositor: shadows, fade animations, subtle rounding
backend = glx;
vsync = false;
paint-on-overlay = true;

shadow = true;
shadow-radius = 9;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.55;
shadow-exclude = [
  "name = 'bravos-panel'",
  "name = 'Desktop'",
  "class_g = 'slop'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.10;
fade-delta = 6;

blur-background = false;

opacity-rule = [
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'brave'",
  "95:class_g = 'Pcmanfm'",
  "100:class_g = 'Tint2'"
];

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; };
  menu    = { fade = true; shadow = true; opacity = 0.98; };
  popup_menu = { fade = true; shadow = true; opacity = 0.98; };
};
