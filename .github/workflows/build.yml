name: Build BraveOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release with the ISO attached'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso grub-pc-bin grub-common \
            grub2-common grub-efi-amd64-bin mtools librsvg2-bin curl \
            ca-certificates gnupg python3-pil python3-cairo python3-numpy \
            build-essential pkg-config libx11-dev libxext-dev \
            libxinerama-dev libcairo2-dev libpango1.0-dev
          sudo mkdir -p /mnt/bravos-build
          sudo chown "$USER:$USER" /mnt/bravos-build

      - name: Generate assets
        run: python3 scripts/gen_assets.py

      - name: Build the ISO
        run: sudo -E bash build.sh
        env:
          BRAVOS_BUILD_DIR: /mnt/bravos-build

      - name: Show build summary
        run: |
          ls -lh /mnt/bravos-build/output/
          cat /mnt/bravos-build/output/SHA256SUMS
          mkdir -p out
          sudo cp /mnt/bravos-build/output/* out/
          sudo chown -R "$USER:$USER" out/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: braveos-iso
          path: out/*
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub release (tag or manual trigger)
        if: startsWith(github.ref, 'refs/tags/') || inputs.release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "BraveOS ${VERSION}" \
              --notes "Bootable ISO of BraveOS ${VERSION} (unofficial Brave-browser-centered Linux distribution). Boot via USB/DVD; UEFI machines must disable Secure Boot for v1. See README for details."
          fi
          gh release upload "$TAG" out/*.iso out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

  smoke-test:
    name: QEMU smoke test
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf python3-pip
          pip3 install --quiet pexpect pillow
          # make KVM usable by the runner user (images often leave it root-only)
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || echo "NO KVM - falling back to TCG"

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: braveos-iso
          path: iso/

      - name: Boot test in QEMU (CD)
        run: python3 scripts/smoke_test.py iso/*.iso cd

      - name: Boot test in QEMU (USB disk, BIOS)
        run: python3 scripts/smoke_test.py iso/*.iso disk

      - name: Boot test in QEMU (USB disk, UEFI)
        run: python3 scripts/smoke_test.py iso/*.iso uefi

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: braveos-test-evidence
          path: |
            ci*/serial-log.txt
            ci*/ram-report.txt
            ci*/screenshot-*.png
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Create GitHub release
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release == true
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: braveos-iso
          path: out/

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "BraveOS ${VERSION}" \
              --notes "Bootable ISO of BraveOS ${VERSION} (unofficial Brave-browser-centered Linux distribution). Boot via USB/DVD; UEFI machines must disable Secure Boot for v1. See README for details."
          fi
          gh release upload "$TAG" out/*.iso out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
