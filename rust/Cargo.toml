[workspace]
resolver = "2"
members = ["crates/xtest", "crates/bui", "crates/bwm", "crates/bshell", "crates/bsettings", "crates/bwall", "crates/bshot"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
debug = false

[workspace.dependencies]
x11rb = { version = "0.14", features = ["randr", "shape"] }
serde_json = "1"
png = "0.17"
ryucorp_freetype = "0.38"
fontconfig = "0.11"
rustybuzz = "0.20"
