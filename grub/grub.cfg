set timeout=6
set default=0

insmod all_video
insmod png
if loadfont /boot/grub/fonts/dejavu16.pf2 ; then
  set font="Unicode"
  insmod gfxterm
  if background_image /boot/grub/grub-bg.png ; then
    set color_normal=white/black
    set color_highlight=black/lightgray
  fi
fi

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

menuentry "BraveOS - Live session" {
  linux /live/vmlinuz boot=live console=tty1 console=ttyS0,115200
  initrd /live/initrd.img
}

menuentry "BraveOS - Live session (safe graphics: nomodeset)" {
  linux /live/vmlinuz boot=live nomodeset console=tty1 console=ttyS0,115200
  initrd /live/initrd.img
}

menuentry "BraveOS - Live session (copy to RAM: faster, needs RAM)" {
  linux /live/vmlinuz boot=live toram console=tty1 console=ttyS0,115200
  initrd /live/initrd.img
}

menuentry "BraveOS - Install BraveOS to disk (guided)" {
  linux /live/vmlinuz boot=live bravos.installer=1 console=tty1 console=ttyS0,115200
  initrd /live/initrd.img
}

menuentry "BraveOS - Live session (verbose boot output)" {
  linux /live/vmlinuz boot=live console=tty1 console=ttyS0,115200
  initrd /live/initrd.img
}
